name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The same checks as `npm run check`, as separate steps so a failure names its cause.
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        # Same as `npm run lint`; errors are also printed as annotations on the commit.
        run: |
          npx eslint . --format json --output-file eslint-report.json || {
            node -e "for (const f of require('./eslint-report.json')) for (const m of f.messages) console.log('::' + (m.severity === 2 ? 'error' : 'warning') + ' file=' + f.filePath.replace(process.cwd() + '/', '') + ',line=' + m.line + '::' + (m.ruleId ?? '') + ': ' + m.message)"
            exit 1
          }
      - name: Test
        run: npm test
      - name: Build
        run: npx vite build
      - run: npm run eval
